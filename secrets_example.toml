# 이 파일은 예시입니다.
# 실제 사용 시 `.streamlit/secrets.toml` 로 복사한 뒤 발급받은 키를 채워 넣으세요.
# 절대 GitHub에 커밋하지 마세요 (.gitignore 에 이미 등록되어 있습니다).
#
# Streamlit Community Cloud 배포 시에는
#   App settings > Secrets 메뉴에 아래 내용을 그대로 붙여넣으면 됩니다.

# ============================================================
# 1. AI 자기소개서 생성 · 첨삭 · 점수 해설 (선택, 프리미엄 회원 전용)
#    키를 넣어도 아래 PREMIUM_USER_IDS 에 있는 소셜 로그인 계정만 Claude 를
#    호출합니다. 목록이 비어 있으면 API 호출 0회 · 과금 없음.
#    (나머지 사용자는 템플릿 생성 · 규칙 점검 · 요청문 복사로 동작)
# ============================================================
CLAUDE_API_KEY = "여기에_Anthropic_Claude_API_키_입력"
# 프리미엄 회원 user_id 목록. 마이페이지가 아니라 data/userdata 또는 DB 의 user_id 값.
# 예: PREMIUM_USER_IDS = ["kakao_1234567890", "google_abc"]
PREMIUM_USER_IDS = []

# ============================================================
# 2. 실시간 채용/자격증 데이터 연동 (선택)
#    없으면 data/backup_master.json 백업 마스터 데이터로 동작합니다.
# ============================================================
QNET_API_KEY = "여기에_공공데이터포털_서비스키_입력"
WORKNET_API_KEY = "여기에_고용24(워크넷)_인증키_입력"

# ============================================================
# 3. 소셜 로그인 (선택)
# ------------------------------------------------------------
# 아래 키를 등록하면 로그인 화면의 '🔒 준비중' 버튼이 코드 수정 없이
# 즉시 실제 OAuth 로그인으로 전환됩니다.
# 키가 하나도 없어도 게스트모드로 모든 기능이 100% 동작합니다.
#
# ⚠️ 가장 흔한 실패 원인: Redirect URI 불일치
#    아래 OAUTH_REDIRECT_URI 와, 각 개발자 콘솔에 등록한 주소가
#    프로토콜(http/https)·슬래시까지 문자 단위로 같아야 합니다.
#    로컬 개발용과 배포용을 콘솔에 둘 다 등록해두면 편합니다.
# ============================================================
OAUTH_REDIRECT_URI = "http://localhost:8501"
# 배포 후에는 아래처럼 바꾸세요:
# OAUTH_REDIRECT_URI = "https://<앱이름>.streamlit.app"

# --- 카카오 (https://developers.kakao.com) ---
#   내 애플리케이션 > 앱 키 > REST API 키 → CLIENT_ID
#   카카오 로그인 활성화 + 동의항목(닉네임) 설정 필요
#   CLIENT_SECRET 은 '보안' 메뉴에서 사용함으로 설정한 경우에만 입력
# KAKAO_CLIENT_ID = ""
# KAKAO_CLIENT_SECRET = ""

# --- 네이버 (https://developers.naver.com) ---
#   애플리케이션 등록 > 네이버 로그인 API 추가 후 Client ID/Secret 발급
# NAVER_CLIENT_ID = ""
# NAVER_CLIENT_SECRET = ""

# --- 구글 (https://console.cloud.google.com/apis/credentials) ---
#   OAuth 2.0 클라이언트 ID(웹 애플리케이션) 생성
#   ※ 미검증 앱은 테스트 사용자 100명 제한이 있습니다
# GOOGLE_CLIENT_ID = ""
# GOOGLE_CLIENT_SECRET = ""

# ============================================================
# 4. NAVER OGQ마켓 경연 API (마스코트 캐릭터)
# ------------------------------------------------------------
# 마스코트 이미지는 최초 1회만 내려받아 assets/mascot/ 에 저장해 쓰므로,
# 앱 실행 중에는 이 키를 쓰지 않습니다. 이미지를 새로 받을 때만 필요합니다.
#   내려받기: python3 scripts/fetch_mascot.py --list
# ============================================================
OGQ_API_KEY = "여기에_OGQ_경연_API_키_입력"

# ------------------------------------------------------------
# 저장소 — 기록을 영구 보관하려면 (설정 순서: docs/STORAGE.md)
# ------------------------------------------------------------
# 없으면 로컬 파일로 동작합니다. 앱은 그대로 돌아가지만 Streamlit Cloud 에서는
# 재배포·슬립 해제 시 진단 점수·찜한 기업·로드맵 스탬프가 사라집니다.
# SUPABASE_URL = "https://xxxxx.supabase.co"
# SUPABASE_KEY = "eyJhbGciOi..."

# ============================================================
# 팀 관리자 (선택)
#    여기 적힌 user_id 만 마이페이지에 '기업 데이터 입력' 메뉴가 보이고,
#    화면 자체도 이 목록으로 다시 검사한다 (URL 직접 진입 차단).
#    비어 있으면 아무도 관리자가 아니다.
#    게스트 계정은 이어하기 코드만 알면 누구나 들어올 수 있으므로
#    소셜 로그인 계정을 권장한다.
# ============================================================
ADMIN_USER_IDS = []

# ============================================================
# 사용 기록 (마이페이지 > 사용 통계, 관리자 전용)
# ------------------------------------------------------------
# APP_ENV 가 "production" 이 아니면 쌓이는 기록이 전부 '테스트'로 표시되어
# 통계에서 빠진다. 배포 서버(Streamlit Cloud)의 Secrets 에만 production 을 넣는다.
# 개발 PC 의 secrets.toml 에는 넣지 않는다.
# ============================================================
APP_ENV = "production"
# 사용자 ID 해시에 섞는 값 (선택). 아무 긴 문자열. 한 번 정하면 바꾸지 않는다 —
# 바꾸면 같은 사람이 다른 사람으로 집계된다.
LOG_SALT = ""
# 통계에서 빼고 싶은 팀원 계정 (관리자 · 데모 계정은 자동으로 빠진다)
TEST_USER_IDS = []

