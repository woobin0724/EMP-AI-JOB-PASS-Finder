[theme]
# 국가기술자격증 수첩 세계 — 밝은 보안용지 바탕 + 수첩 표지 네이비.
# 교실·실습실의 형광등 아래 폰으로 보는 화면이라 밝은 바탕을 쓴다.
# ui/theme.py 의 토큰과 값을 반드시 일치시킬 것.
base = "light"
primaryColor = "#14284A"
backgroundColor = "#EDF1EF"
secondaryBackgroundColor = "#FFFFFF"
showWidgetBorder = true
textColor = "#18212D"
borderColor = "#C6D0CC"
linkColor = "#1F4E8C"
baseRadius = "small"
font = "sans serif"

# ※ 이 파일은 반드시 `.streamlit/` 폴더 안에 있어야 합니다.
#    프로젝트 루트의 config.toml 은 Streamlit이 읽지 않아 테마가 적용되지 않습니다.

[server]
# 업로드 한도 등 기본값 유지. 배포 시 Streamlit Cloud 설정이 우선합니다.
maxUploadSize = 50
